[package]
name = "tasks_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
dotenv = "0.15.0"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "macros"
] }
serde = { version = "1.0", features = ["derive"] }
argon2 = "0.5"
password-hash = "0.5"
rand = "0.8"
jsonwebtoken = "9"
chrono = "0.4"
serde_json = "1.0.150"
utoipa = { version = "5", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
